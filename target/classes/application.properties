spring.application.name=ProjetoPI

# Database
spring.datasource.url=
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# JWT - IMPORTANTE: Use uma chave mais forte em produção
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Logging
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.com.zaxxer.hikari=debug
logging.level.org.springframework.security=DEBUG

# Server
server.port=${PORT:8081}
server.error.include-message=always

file.upload-dir=uploads

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}

spring.mail.properties.mail.smtp.from=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=10MB
# Tamanho mï¿½ximo da requisiï¿½ï¿½o completa (11 MB = arquivo + campos do form)
spring.servlet.multipart.max-request-size=11MB
# Habilita multipart explicitamente
spring.servlet.multipart.enabled=true

ocr.enabled=${OCR_ENABLED:false}
ocr.tessdata-path=${OCR_TESSDATA_PATH:/usr/share/tesseract-ocr/4.00/tessdata}

